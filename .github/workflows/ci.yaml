name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6.0.10
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
