name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - run: pnpm install
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
