name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "24.19.0"
      - run: pnpm install
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
